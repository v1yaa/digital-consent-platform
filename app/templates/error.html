{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block page_title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="card-panel" style="max-width:520px;margin:60px auto;text-align:center;padding:48px 32px;">
  <div style="font-size:64px;font-weight:800;color:var(--clr-revoked);line-height:1;">{{ code }}</div>
  <h2 style="margin:16px 0 8px;font-size:20px;">{{ message }}</h2>
  <p style="color:var(--text-muted);margin-bottom:28px;">Please go back and try again.</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary">← Back to Dashboard</a>
</div>
{% endblock %}
